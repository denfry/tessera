name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  cancel-in-progress: false
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
      - name: JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ github.run_number }}
          path: folia-server/build/libs/*-paperclip-*.jar
