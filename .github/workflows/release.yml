name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  cancel-in-progress: false
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build Paperclip
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Rename jar
        id: jar
        run: |
          mc=$(grep '^mcVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          name="tessera-${mc}-${BUILD_NUMBER}.jar"
          cp folia-server/build/libs/*-paperclip-*.jar "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=${mc}-build.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ github.run_number }}
          path: ${{ steps.jar.outputs.name }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.jar.outputs.tag }}"             "${{ steps.jar.outputs.name }}" "${{ steps.jar.outputs.name }}.sha256"             --target "$GITHUB_SHA"             --title "Tessera ${{ steps.jar.outputs.tag }}"             --notes "Build ${BUILD_NUMBER} from $(git rev-parse --short HEAD). Changes on top of Folia: see PATCHES.md."             --prerelease
