name: Server crash or Stacktrace
description: Report server crashes or scary stacktraces
labels: [ "status: needs triage" ]
body:
  - type: textarea
    attributes:
      label: Stack trace
      description: |
        We need all of the stack trace! Do not cut off parts of it. Please do not use attachments.
        If you prefer, you can use a paste site like https://paste.gg.
      value: |
        ```
        paste your stack trace or a paste.gg link here!
        ```
      placeholder: Please don't remove the backticks; it makes your issue a lot harder to read!
    validations:
      required: true

  - type: textarea
    attributes:
      label: Plugin and Datapack List
      description: |
        All plugins and datapacks running on your server.
        To list plugins, run `/plugins`. For datapacks, run `/datapack list`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actions to reproduce (if known)
      description: This may include a build schematic, a video, or detailed instructions to help reconstruct the issue. Anything helps!
    validations:
      required: false

  - type: textarea
    attributes:
      label: Tessera version
      description: |
        Run `/version` on your server and **paste** the full, unmodified output here.
        "latest" is *not* a version; we require the output of `/version` so we can adequately track down the issue.
        Additionally, do NOT provide a screenshot, you MUST paste the entire output.
        <details>
        <summary>Example (exact format may differ)</summary>

        ```
        > version
        [10:00:11 INFO]: Checking version, please wait...
        [10:00:12 INFO]: This server is running Tessera version 26.3-DEV-main@6c3e37e (MC: 26.3) (Implementing API version 26.3-R0.1-SNAPSHOT)
        ```
        
        </details>
    validations:
      required: true

  - type: textarea
    attributes:
      label: Other
      description: |
        Please include other helpful information below, if any.
        The more information we receive, the quicker and more effective we can be at finding the solution to the issue.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Before submitting this issue, please ensure the following:

        1. You are running the latest Tessera build from [Releases](https://github.com/denfry/tessera/releases).
        2. Your version of Minecraft is supported by Tessera (currently 26.3).
        3. The crash does not happen on stock [Folia](https://github.com/PaperMC/Folia). If it does, report it upstream.

        If your log contains `DO NOT REPORT THIS TO FOLIA`, it is a watchdog lag report rather than a crash:
        open a Performance Problem issue with a spark profile instead.
        Crash exploits must be reported through a
        [private security advisory](https://github.com/denfry/tessera/security/advisories/new).